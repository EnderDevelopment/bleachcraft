plugins {
    id 'fabric-loom' version '1.4-SNAPSHOT'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Minecraft'
        url = 'https://libraries.minecraft.net/'
    }
}

extraProperties {
    properties {
        mod_version = project.property('mod_version')
        minecraft_version = project.property('minecraft_version')
        loader_version = project.property('loader_version')
        maven_group = project.property('maven_group')
        archives_base_name = project.property('archives_base_name')
    }
}

loom {
    minecraftVersion = project.property('minecraft_version')
    runConfigs.create('client') {
        mainClass = 'net.fabricmc.loader.launch.knot.KnotClient'
        propertyMap.putAll(
            'fabric.development': 'true',
            'fabric.api': 'true'
        )
    }
    runConfigs.create('server') {
        mainClass = 'net.fabricmc.loader.launch.knot.KnotServer'
        propertyMap.putAll(
            'fabric.development': 'true',
            'fabric.api': 'true'
        )
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:${minecraft_version}'
    mappings 'net.fabricmc:yarn:${minecraft_version}:v2'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:${fabric_api_version}'
    modImplementation 'org.jetbrains:annotations:24.0.1'
    modImplementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.20'
    modImplementation 'org.jetbrains.kotlin:kotlin-reflect:1.9.20'
    include 'com.mojang:minecraft:${minecraft_version}:sources'
    include 'net.fabricmc:yarn:${minecraft_version}:v2:sources'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.property('minecraft_version')
    from(sourceSets.main.resources.srcDirs) {
        include 'fabric.mod.json'
        expand [project: project]
    }
    into 'build/resources/main'
}